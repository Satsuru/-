# Запуск: mvn spring-boot:run
# GraphiQL: http://localhost:8088/graphiql
# Заголовок X-User-Id: 1 — гость из начальных данных
server:
  port: 8088

spring:
  datasource:
    url: jdbc:h2:mem:platform;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
  graphql:
    graphiql:
      enabled: true
