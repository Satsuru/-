# Сначала сервис аутентификации: mvn -pl identity -am spring-boot:run
# Затем шлюз: mvn -pl gateway -am spring-boot:run
# GraphiQL: http://localhost:8088/graphiql
# Вход: guest@hotel.local / guest, сотрудник worker@hotel.local / worker, администратор admin@hotel.local / admin
server:
  port: 8088

auth:
  service:
    url: http://127.0.0.1:8081

spring:
  graphql:
    graphiql:
      enabled: true
